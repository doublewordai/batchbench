name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust crate
        run: |
          cargo check --manifest-path rust/Cargo.toml --all-targets
          cargo test --manifest-path rust/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path rust/Cargo.toml --features python --out dist

      - name: Install wheel
        run: python -m pip install dist/batchbench-*.whl

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test Python API
        run: |
          python - <<'PY'
          import batchbench

          cfg = {
              "endpoint": "https://example.com/v1/chat/completions",
              "user_count": 1,
              "mode": {"kind": "finite", "requests_per_user": 1},
              "request_body": {
                  "body": {
                      "model": "gpt-4o-mini",
                      "messages": [{"role": "user", "content": "ping"}],
                  },
                  "line_idx": 0,
                  "input_tokens": 1,
              },
              "requests": [
                  {
                      "body": {
                          "model": "gpt-4o-mini",
                          "messages": [{"role": "user", "content": "ping"}],
                          "max_tokens": 4,
                      },
                      "line_idx": 0,
                      "input_tokens": 1,
                  }
              ],
              "dry_run": True,
          }
          report = batchbench.run_benchmark(cfg)
          assert report["failed_requests"] == 0, report
          assert "total_requests" in report, report
          PY

      - name: Smoke test CLI
        run: |
          batchbench-agent --help
          batchbench \
            --host https://example.com \
            --endpoint /v1/chat/completions \
            --model gpt2 \
            --users 1 \
            --requests-per-user 1 \
            --gen-approx-input-tokens 8 \
            --output-tokens 4 \
            --dry-run
