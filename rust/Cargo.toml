[package]
name = "batchbench-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "batchbench_rs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "signal"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_distr = "0.4"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
tokenizers = { version = "0.22.2", features = ["http"] }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"], optional = true }
