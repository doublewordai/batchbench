server:
  model: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  startup_timeout: 600
  args:
    port: 8000
    max-model-len: 131072
    gpu-memory-utilization: 0.9
    tensor-parallel-size: 1
    trust-remote-code: true
  env:
    VLLM_ATTENTION_BACKEND: FLASHINFER

# Source data for distribution fitting (optional)
# Uncomment one of the following source configurations:

# Option 1: Download from WildChat
source:
  type: wildchat
  path: ./data/wildchat_50k.jsonl
  num_samples: 50000
  language: English
  seed: 42
  # min_turns: 1              # Minimum conversation turns to include
  # max_turns: 10             # Maximum conversation turns to include
  # Tokenization options for fitting:
  tokenizer: Qwen/Qwen3-30B-A3B-Instruct-2507    # Options: gpt2, r50k_base, p50k_base, cl100k_base, o200k_base
  # use_chars: false          # Use character count instead of tokens
  # no_chat_template: false   # Don't apply chat template (just sum content lengths)
  bins: 1000                  # Number of histogram bins for distribution plot

# Option 2: Use existing local file
# source:
#   type: local
#   path: ./data/my_dataset.jsonl

dataset:
  count: 1000
  seed: 42
  # prefix_overlap: 0.0       # Fraction of tokens shared as prefix across requests (0.0-1.0)

  # Option A: Auto-fit from source (requires source section above)
  dist_mode: lognormal
  fit_from_source: true

  # Option B: Manual lognormal params (no source section needed)
  # dist_mode: lognormal
  # dist_median: 1000
  # dist_sigma: 1.68
  # dist_max: 128000

  # Option C: Fixed token length (no source section needed)
  # dist_mode: fixed
  # approx_input_tokens: 512

benchmark:
  users: 32
  requests_per_user: 10
  random_requests: true
  output_lognorm_mu: 6
  output_lognorm_sigma: 0.7
  output_lognorm_max: 2000
  request_timeout_secs: 10000
  seed: 42
