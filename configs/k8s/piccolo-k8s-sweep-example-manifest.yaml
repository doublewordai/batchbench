apiVersion: batch/v1
kind: Job
metadata:
  name: piccolo-k8s-sweep-example-job
  namespace: specdec
  labels:
    app.kubernetes.io/name: batchbench-sweep
    app.kubernetes.io/component: benchmark
    batchbench.doubleword.ai/sweep-name: piccolo-k8s-sweep-example
  annotations:
    batchbench.doubleword.ai/image: tytn/batchbench-sglang-sweep:example
    batchbench.doubleword.ai/created-at: '2026-04-27T16:56:23+00:00'
    batchbench.doubleword.ai/git-sha: 6c8524e0b4ea
spec:
  completionMode: Indexed
  completions: 294
  parallelism: 1
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batchbench-sweep
        app.kubernetes.io/component: benchmark
        batchbench.doubleword.ai/sweep-name: piccolo-k8s-sweep-example
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      priorityClassName: research
      containers:
      - name: benchmark
        image: tytn/batchbench-sglang-sweep:example
        imagePullPolicy: IfNotPresent
        env:
        - name: SWEEP_NAME
          value: piccolo-k8s-sweep-example
        - name: OUTPUT_ROOT
          value: /outputs/piccolo-k8s-sweep-example
        - name: COMBINATIONS_JSON
          value: /config/combinations.json
        - name: SHARED_RESULTS_CSV
          value: /outputs/piccolo-k8s-sweep-example/results/summary.csv
        - name: CSV_LOCK_PATH
          value: /outputs/piccolo-k8s-sweep-example/results/summary.csv.lock
        - name: REQUEST_TIMEOUT_SECS
          value: '6000'
        - name: REQUESTS_PER_USER
          value: '1'
        - name: IMAGE_REF
          value: tytn/batchbench-sglang-sweep:example
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SGLANG_USE_CUDA_IPC_TRANSPORT
          value: '0'
        - name: SGLANG_ENABLE_SPEC_V2
          value: '1'
        resources:
          limits:
            nvidia.com/gpu: '4'
            cpu: '64'
            memory: 512Gi
          requests:
            nvidia.com/gpu: '4'
            cpu: '64'
            memory: 512Gi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: outputs
          mountPath: /outputs
        - name: cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: config
        configMap:
          name: piccolo-k8s-sweep-example-config
      - name: outputs
        hostPath:
          path: /mnt/raid/batchbench
          type: DirectoryOrCreate
      - name: cache
        hostPath:
          path: /mnt/raid/cache
          type: DirectoryOrCreate
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
