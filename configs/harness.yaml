instance:
  # Harness-level config (not passed to API)
  name-prefix: batchbench
  docker-image: tytn/batchbench:cu126
  provision-timeout: 600

  # Passed directly to API via check_availability 
  availability:
    gpu-type: H100_80GB
    gpu-count: 1
    security: secure_cloud
    # regions:
    #   - united_states
    #   - south_america
    # socket: PCIe

  # Passed to create_pod API
  create:
    image: ubuntu_22_cuda_12
    diskSize: 100


vllm:
  model: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  startup-timeout: 600

  # vLLM serve arguments
  args:
    port: 8000
    host: 0.0.0.0
    max-model-len: 131072
    gpu-memory-utilization: 0.9
    trust-remote-code: true
    # tensor-parallel-size: 1
    # enable-expert-parallel: false

  # Environment variables for vLLM
  # env:
    # VLLM_ATTENTION_BACKEND: FLASHINFER
    # VLLM_HAS_FLASHINFER_CUBIN: "1"
    # VLLM_USE_FLASHINFER_MOE_FP8: "1"


generate:
  output: data/output.jsonl
  count: 10000
  seed: 42
  prefix-overlap: 0.0
  tokenizer: Qwen/Qwen3-30B-A3B-Instruct-2507
  dist-mode: lognormal
  dist-median: 1000
  dist-sigma: 1.68
  dist-max: 128000
  # approx-input-tokens: 512
  # token-tolerance: 50


benchmark:
  # Load configuration
  users: 32
  requests-per-user: 10
  random-requests: true
  seed: 42

  # Output token distribution (lognormal)
  output-lognorm-mu: 6
  output-lognorm-sigma: 0.7
  output-lognorm-max: 2000

  # Alternative: fixed output tokens
  # output-tokens: 300
  # output-vary: 200

  # Timeouts and retries
  # request-timeout-secs: 10000
  # max-retries: 2
  # retry-delay-ms: 250

  # Results output (optional)
  # results-csv: results/benchmark.csv
