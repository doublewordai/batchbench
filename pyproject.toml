[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batchbench"
version = "0.1.1"
description = "Offline and online benchmarking utilities for large language model workloads"
readme = "README.md"
authors = [
    {name = "BatchBench Contributors"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
harness = ["requests>=2.28.0", "paramiko>=3.0.0", "prime"]

[project.scripts]
'batchbench.harness' = "batchbench.harness:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
