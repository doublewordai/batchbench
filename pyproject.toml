[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "batchbench"
version = "0.1.1"
description = "Offline and online benchmarking utilities for large language model workloads"
readme = "README.md"
authors = [
    {name = "BatchBench Contributors"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
harness = ["requests>=2.28.0", "paramiko>=3.0.0", "prime"]

[project.scripts]
batchbench = "batchbench.__main__:main"
batchbench-agent = "batchbench.agent:main"
batchbench-harness = "batchbench.harness:main"
'batchbench.harness' = "batchbench.harness:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "batchbench._core"
features = ["python"]
