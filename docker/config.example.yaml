# BatchBench Configuration File
# Mount this file into the container and set CONFIG_FILE environment variable to its path

# Mode: 'offline' or 'online'
mode: offline

# Offline benchmark configuration
offline:
  model: null  # Model name or path
  num_reqs: null  # Number of requests
  icl: null  # Input context length
  ocl: null  # Output context length
  throughput_dir: null  # Directory for throughput results
  tensor_parallel_size: null  # Tensor parallelism size
  pipeline_parallel_size: null  # Pipeline parallelism size
  gpu_memory_utilization: null  # GPU memory utilization (0.0-1.0)
  max_num_batched_tokens: null  # Max batched tokens
  extra_args: []  # Additional arguments as a list

# Online benchmark configuration
online:
  # Model and server settings
  model: null  # Model name or path for server
  client_model: null  # Model name for client (defaults to model)
  
  # Server settings
  server:
    host: "0.0.0.0"
    port: 8000
    tensor_parallel_size: null
    pipeline_parallel_size: null
    max_num_batched_tokens: null
    gpu_memory_utilization: null
    gpu_name: null  # Optional descriptive label recorded with results
    gpu_count: null  # Optional integer count recorded with results
    extra_args: []  # Additional server arguments as a list
    
    # Health check settings
    wait_retries: 60
    wait_delay_secs: 1
    health_url: null  # Override default health check URL
  
  # Client settings
  client:
    host: null  # Base URL (defaults to http://127.0.0.1:{server.port})
    endpoint: null  # API endpoint
    users: null  # Number of concurrent users
    requests_per_user: null  # Requests per user
    api_key: null  # API key
    api_key_env: null  # Environment variable containing API key
    request_timeout_secs: null  # Request timeout in seconds
    max_retries: null  # Max retry attempts
    retry_delay_ms: null  # Retry delay in milliseconds
    output_tokens: null  # Number of output tokens (fixed)
    output_vary: null  # Output token variation (+/- uniform)
    output_lognorm_mu: null  # Log-normal mu parameter (mean of underlying normal)
    output_lognorm_sigma: null  # Log-normal sigma parameter (std dev of underlying normal)
    random_requests: false  # Randomize request order
    verbose: false  # Verbose output
    results_csv: null  # Path for CSV summary (defaults to /tmp/batchbench_results.csv)
    
    # Server reporting settings (handled by run_docker)
    server_url: null  # Server URL to post results to
    project_name: null  # Project name for reporting
    experiment_name: null  # Experiment name for reporting
    
    extra_args: []  # Additional client arguments as a list

# Dataset generation configuration (for online mode)
generate:
  dataset_path: /tmp/batchbench_requests.jsonl  # Path to dataset file
  count: null  # Number of requests to generate
  prefix_overlap: null  # Prefix overlap ratio
  approx_input_tokens: null  # Approximate input tokens
  tokenizer_model: null  # Tokenizer model
  token_tolerance: null  # Token tolerance
  huggingface_token: null  # HuggingFace token
  extra_args: []  # Additional generation arguments as a list
