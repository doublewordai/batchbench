# BatchBench Configuration - Online Example
# This example shows an online benchmark configuration with server and client

mode: online

online:
  # Model for the vLLM server
  model: "Qwen/Qwen3-0.6B"
  
  server:
    host: "0.0.0.0"
    port: 8000
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.75
    extra_args: []
    
    # Health check configuration
    wait_retries: 10000
    wait_delay_secs: 5
    health_url: null  # Defaults to http://127.0.0.1:{port}/v1/models
  
  client:
    host: null  # Defaults to http://127.0.0.1:{server.port}
    endpoint: "/v1/chat/completions"
    users: 10
    requests_per_user: 5
    api_key: null
    api_key_env: null
    request_timeout_secs: 120
    max_retries: 3
    retry_delay_ms: 100
    output_tokens: 128
    output_vary: 20
    random_requests: true
    verbose: false
    extra_args: []

# Dataset generation configuration
generate:
  dataset_path: /tmp/batchbench_requests.jsonl
  count: 100
  dist_mode: "lognormal"
  dist_median: 512
  dist_sigma: 0.5
  dist_max: 1024
  tokenizer_model: "Qwen/Qwen3-0.6B"
  huggingface_token: null  # Set if model requires authentication
  extra_args: []

# Offline section not needed for online mode
offline: {}
