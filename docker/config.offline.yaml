# BatchBench Configuration - Offline Example
# This example shows an offline benchmark configuration

mode: offline

offline:
  model: "Qwen/Qwen3-0.6B"
  num_reqs: 100
  icl: 512
  ocl: 128
  throughput_dir: "/workspace/results"
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.9
  max_num_batched_tokens: 8192
  extra_args: []

# Online and generate sections not needed for offline mode
online: {}
generate: {}
