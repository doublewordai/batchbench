# BatchBench Configuration - Full Example with All Parameters
# This example shows an online benchmark with lognormal output sampling and server reporting

mode: online

online:
  # Model for the vLLM server
  model: "Qwen/Qwen3-0.6B"
  
  server:
    host: "0.0.0.0"
    port: 8000
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.75
    gpu_name: "NVIDIA-3060"  # Optional: recorded in server payloads only
    gpu_count: 1              # Optional: recorded in server payloads only
    extra_args: []
    
    # Health check configuration
    wait_retries: 120
    wait_delay_secs: 5
    health_url: null  # Defaults to http://127.0.0.1:{port}/v1/models
  
  client:
    host: null  # Defaults to http://127.0.0.1:{server.port}
    endpoint: "/v1/chat/completions"
    users: 16
    requests_per_user: 1
    api_key: null
    api_key_env: null
    request_timeout_secs: 300
    max_retries: 3
    retry_delay_ms: 500
    
    # Output token configuration - choose ONE of these approaches:
    # Option 1: Fixed output tokens with uniform variation
    # output_tokens: 128
    # output_vary: 32  # +/- 32 tokens uniform variation
    
    # Option 2: Log-normal distribution for realistic output lengths
    # The log-normal distribution is parameterized by mu and sigma of the underlying normal.
    # Expected median = exp(mu), expected mean = exp(mu + sigma^2/2)
    # Example: mu=5.0, sigma=0.8 gives median≈148, mean≈224 tokens
    output_lognorm_mu: 5.0
    output_lognorm_sigma: 0.8
    
    random_requests: true
    verbose: false
    results_csv: "/tmp/batchbench_results.csv"
    
    # Server reporting - run_docker posts CSV results after the run completes
    server_url: "https://titan-6-1.tail5ef35.ts.net/"
    project_name: "my-benchmark-project"
    experiment_name: "qwen3-lognorm-test"
    
    extra_args: []

# Dataset generation configuration
generate:
  dataset_path: /tmp/batchbench_requests.jsonl
  count: 200
  dist_mode: "lognormal"
  dist_median: 512
  dist_sigma: 0.5
  dist_max: 2048
  tokenizer_model: "Qwen/Qwen3-0.6B"
  huggingface_token: null  # Set if model requires authentication
  extra_args: []

# Offline section not needed for online mode
offline: {}
